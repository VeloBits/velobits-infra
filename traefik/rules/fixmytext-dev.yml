# Dev Traefik routes for local VeloBits/FixMyText services.
#
# Frontend Docker compose publishes the nginx router on host port 3000.
# Backend services live on the same Docker network as Traefik.
#
# Higher priority wins when both routers could match.
# Prod equivalents (fixmytext.velobits.dev) are added at production deploy.

http:
  routers:
    # API gateway: Kong routes /api/v1/* to backend services.
    fixmytext-dev-api:
      rule: "Host(`api-dev.velobits.dev`)"
      priority: 10
      service: fixmytext-dev-kong-svc
      entryPoints:
        - web

    # Identity provider: Keycloak dev realm.
    fixmytext-dev-auth:
      rule: "Host(`auth-dev.velobits.dev`)"
      priority: 10
      service: fixmytext-dev-keycloak-svc
      entryPoints:
        - web

    # Content app: static pages, SEO tool pages, share pages, marketing root.
    # Traefik v3 requires exactly one argument per PathPrefix matcher - the
    # v2 multi-arg form is rejected and silently disables the router.
    fixmytext-dev-content:
      rule: "Host(`develop-fixmytext.velobits.dev`) && (Path(`/`) || PathPrefix(`/tools`) || PathPrefix(`/about`) || PathPrefix(`/pricing`) || PathPrefix(`/share`))"
      priority: 20
      service: fixmytext-dev-content-svc
      entryPoints:
        - web

    # Web app: everything not claimed by the content router above
    # (priority 20 beats 10), including /app/*.
    fixmytext-dev-web:
      rule: "Host(`develop-fixmytext.velobits.dev`)"
      priority: 10
      service: fixmytext-dev-web-svc
      entryPoints:
        - web

  services:
    fixmytext-dev-kong-svc:
      loadBalancer:
        servers:
          - url: "http://kong:8000"

    fixmytext-dev-keycloak-svc:
      loadBalancer:
        servers:
          - url: "http://keycloak-dev:8080"

    fixmytext-dev-content-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3103"

    fixmytext-dev-web-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"
