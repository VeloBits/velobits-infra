# Dev Traefik routes for local VeloBits/FixMyText services.
#
# Frontend Docker compose publishes the nginx router on host port 3100.
# Backend services live on the same Docker network as Traefik.
#
# Higher priority wins when both routers could match.
# Prod equivalents (fixmytext.velobits.dev) are added at production deploy.

http:
  routers:
    # API gateway: Kong routes /api/v1/* to backend services.
    fixmytext-dev-api:
      rule: "Host(`api-dev.fixmytext.velobits.dev`)"
      priority: 10
      service: fixmytext-dev-kong-svc
      entryPoints:
        - websecure
      tls: {}

    # ---------------- Front starts here

    # Router app: static pages, SEO tool pages, share pages, marketing root.
    # Traefik v3 requires exactly one argument per PathPrefix matcher - the
    # v2 multi-arg form is rejected and silently disables the router.
    fixmytext-dev-router:
      rule: "Host(`fixmytext-dev.velobits.dev`) && (Path(`/`) || PathPrefix(`/tools`) || PathPrefix(`/about`) || PathPrefix(`/pricing`) || PathPrefix(`/share`))"
      priority: 20
      service: fixmytext-dev-router-svc
      entryPoints:
        - websecure
      tls: {}

    # Editor app: static pages, SEO tool pages, share pages, marketing root.
    fixmytext-dev-editor:
      rule: "Host(`fixmytext-dev-editor.velobits.dev`) && (Path(`/`) || PathPrefix(`/tools`) || PathPrefix(`/about`) || PathPrefix(`/pricing`) || PathPrefix(`/share`))"
      priority: 20
      service: fixmytext-editor-dev-svc
      entryPoints:
        - websecure
      tls: {}

    # Analytics app: static pages, SEO tool pages, share pages, marketing root.
    fixmytext-dev-analytics:
      rule: "Host(`fixmytext-dev-analytics.velobits.dev`) && (Path(`/`) || PathPrefix(`/tools`) || PathPrefix(`/about`) || PathPrefix(`/pricing`) || PathPrefix(`/share`))"
      priority: 20
      service: fixmytext-analytics-dev-svc
      entryPoints:
        - websecure
      tls: {}

    # Content app: static pages, SEO tool pages, share pages, marketing root.
    fixmytext-dev-content:
      rule: "Host(`fixmytext-dev-content.velobits.dev`) && (Path(`/`) || PathPrefix(`/tools`) || PathPrefix(`/about`) || PathPrefix(`/pricing`) || PathPrefix(`/share`))"
      priority: 20
      service: fixmytext-dev-content-svc
      entryPoints:
        - websecure
      tls: {}

    # Shell app: static pages, SEO tool pages, share pages, marketing root.
    fixmytext-dev-shell:
      rule: "Host(`fixmytext-dev-shell.velobits.dev`) && (Path(`/`) || PathPrefix(`/tools`) || PathPrefix(`/about`) || PathPrefix(`/pricing`) || PathPrefix(`/share`))"
      priority: 20
      service: fixmytext-shell-dev-svc
      entryPoints:
        - websecure
      tls: {}

  services:
    fixmytext-dev-kong-svc:
      loadBalancer:
        servers:
          - url: "http://kong:8000"

    fixmytext-dev-router-svc:
      loadBalancer:
        servers:
          - url: "http://fixmytext-router:3100"

    fixmytext-editor-dev-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3101"

    fixmytext-analytics-dev-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3102"

    fixmytext-dev-content-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3103"

    fixmytext-shell-dev-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3104"
