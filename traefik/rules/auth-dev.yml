# Dev Keycloak routes for local VeloBits services.
#
# Docker compose publishes the keycloak service at 8080.
# Services live on the same Docker network as Traefik.
#
# Higher priority wins when both routers could match.
# Prod equivalents (auth.velobits.dev) are added at production deploy.

http:
  routers:
    keycloak:
      rule: Host(`auth.velobits.dev`) || Host(`auth-dev.velobits.dev`)
      service: keycloak
      entryPoints:
        - websecure
      tls: {}

  services:
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak-dev:8080"