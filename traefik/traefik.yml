# Traefik v3 static configuration — VeloBits platform edge proxy.
#
# Responsibilities:
#   1. Accept all *.velobits.dev traffic on :80 (TLS termination at production deploy).
#   2. Route dev hostnames and paths via the file provider
#      (rules in gateway/traefik/rules/).
#
# Providers:
#   - file provider: hostname/path rules in gateway/traefik/rules/

api:
  dashboard: true
  insecure: true   # dev only: dashboard bound to 127.0.0.1:8090

entryPoints:
  web:
    address: ":80"

providers:
  file:
    directory: /etc/traefik/rules
    watch: true

log:
  level: INFO

accessLog: {}
