# Infra Config Validation
# Validates Traefik rules, Keycloak realm exports, and the compose file against
# the exact image tags pinned in docker-compose.yml. Ported from
# fixmytext-backend's ci.yml when Traefik/Keycloak were extracted to this repo.
name: Infra Test & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Traefik & Keycloak Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate Traefik dynamic rules
        # Boot success is NOT the gate - Traefik boots cleanly with broken
        # rules and just disables the affected router. Assert via the API that
        # every file-provider router actually loaded as "enabled".
        run: |
          docker run -d --name traefik-ci -p 127.0.0.1:18080:8080 \
            -v "$PWD/traefik/rules:/etc/traefik/rules:ro" \
            traefik:v3.2 \
            --api.insecure=true \
            --providers.file.directory=/etc/traefik/rules \
            --providers.file.watch=false \
            --entrypoints.web.address=:80

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18080/api/http/routers >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "::error::Traefik API did not come up"
              docker logs traefik-ci
              exit 1
            fi
            sleep 1
          done

          ROUTERS=$(curl -fsS http://127.0.0.1:18080/api/http/routers)
          FILE_ROUTERS=$(echo "$ROUTERS" | jq '[.[] | select(.provider == "file")]')

          # Guard against a vacuous pass (wrong mount path => zero routers).
          if [ "$(echo "$FILE_ROUTERS" | jq 'length')" -lt 2 ]; then
            echo "::error::Expected at least 2 file-provider routers, got fewer - rules did not load"
            echo "$ROUTERS" | jq .
            docker logs traefik-ci
            exit 1
          fi

          if ! echo "$FILE_ROUTERS" | jq -e '[.[] | select(.status != "enabled")] | length == 0' >/dev/null; then
            echo "::error::One or more Traefik file-provider routers failed to load"
            echo "$FILE_ROUTERS" | jq '[.[] | {name, status, error}]'
            docker logs traefik-ci
            exit 1
          fi
          echo "All Traefik file-provider routers enabled"

      - name: Clean up Traefik container
        if: always()
        run: docker rm -f traefik-ci 2>/dev/null || true

      - name: Validate Keycloak realm exports (JSON)
        run: |
          for f in keycloak/realm-export*.json; do
            echo "checking $f"
            python -m json.tool "$f" > /dev/null
          done

      - name: Validate docker-compose config
        # Interpolation-required vars get dummies so config rendering passes.
        run: |
          printf '%s\n' \
            'KEYCLOAK_DEV_ADMIN_PASSWORD=ci-stub' \
            'KEYCLOAK_DEV_DB_USER=ci-stub' \
            'KEYCLOAK_DEV_DB_PASSWORD=ci-stub' > .env
          docker compose config -q
          rm -f .env

  # Cheap path filter so the heavy Keycloak import gate (~90s + 691MB image
  # pull) only runs when the realm/theme files actually change.
  changes:
    name: Detect changed paths
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      keycloak: ${{ steps.filter.outputs.keycloak }}
      theme: ${{ steps.filter.outputs.theme }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            keycloak:
              - 'keycloak/**'
            theme:
              - 'keycloak-theme/**'

  theme-build:
    name: Build velobits Keycloak theme
    runs-on: ubuntu-latest
    needs: [changes]
    # Builds when the theme OR keycloak files change (the import gate mounts
    # the jar, and the realm exports reference the velobits theme), or on
    # manual dispatch. !cancelled() keeps it eligible when `changes` is
    # skipped (workflow_dispatch).
    if: >-
      !cancelled() && (
        needs.changes.outputs.keycloak == 'true' ||
        needs.changes.outputs.theme == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    defaults:
      run:
        working-directory: keycloak-theme
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keycloak-theme/package-lock.json

      # keycloakify build shells out to Maven for jar packaging; Maven ships
      # preinstalled on ubuntu-latest, it only needs a JDK.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build theme jar (vite + tsc + keycloakify)
        run: npm run build-keycloak-theme

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velobits-jar
          path: keycloak-theme/dist_keycloak/velobits.jar
          if-no-files-found: error

  keycloak-import:
    name: Keycloak Realm Import Gate
    runs-on: ubuntu-latest
    needs: [changes, theme-build]
    # Runs when keycloak/** or keycloak-theme/** changed, or on manual
    # dispatch. Requires the theme jar because the realm exports pin
    # loginTheme=velobits. !cancelled() keeps it eligible when `changes` is
    # skipped (workflow_dispatch).
    if: >-
      !cancelled() &&
      needs.theme-build.result == 'success' && (
        needs.changes.outputs.keycloak == 'true' ||
        needs.changes.outputs.theme == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velobits-jar
          path: keycloak-theme/dist_keycloak

      - name: Boot Keycloak and import dev realm
        # Verifies realm-export-dev.json actually imports on the pinned image.
        # Note: /health/* lives on the management port :9000 in KC 26, and the
        # image has no curl - poll the container logs instead.
        run: |
          docker run -d --name kc-ci \
            -v "$PWD/keycloak/realm-export-dev.json:/opt/keycloak/data/import/realm.json:ro" \
            -v "$PWD/keycloak-theme/dist_keycloak:/opt/keycloak/providers:ro" \
            -p 127.0.0.1:18080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=ci-only-password \
            quay.io/keycloak/keycloak:26.0 start-dev --import-realm

          IMPORTED=0
          for _ in $(seq 1 90); do
            LOGS=$(docker logs kc-ci 2>&1)
            if echo "$LOGS" | grep -q "Import finished successfully"; then
              echo "Realm import succeeded"
              IMPORTED=1
              break
            fi
            if echo "$LOGS" | grep -qE "Failed to import|ERROR \[org\.keycloak"; then
              echo "::error::Keycloak realm import failed"
              docker logs kc-ci
              exit 1
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' kc-ci)" != "true" ]; then
              echo "::error::Keycloak container exited before import completed"
              docker logs kc-ci
              exit 1
            fi
            sleep 2
          done
          if [ "$IMPORTED" != "1" ]; then
            echo "::error::Timed out waiting for realm import (180s)"
            docker logs kc-ci
            exit 1
          fi

          # Realm import succeeds even if the referenced theme is missing
          # (theme resolution is lazy) - so also assert the login page really
          # renders velobits. The local-velobits client enforces PKCE
          # (S256): without code_challenge Keycloak redirects the error to
          # redirect_uri instead of rendering the themed login page.
          AUTH_URL="http://127.0.0.1:18080/realms/Velobits/protocol/openid-connect/auth?client_id=local-velobits&redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Fauth%2Fcallback&response_type=code&scope=openid&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256"
          HTML=""
          for _ in $(seq 1 15); do
            HTML=$(curl -fsS "$AUTH_URL" || true)
            [ -n "$HTML" ] && break
            sleep 2
          done
          if ! echo "$HTML" | grep -q "login/velobits"; then
            echo "::error::Login page did not render the velobits theme"
            echo "$HTML" | head -c 2000
            docker logs kc-ci | tail -50
            exit 1
          fi
          echo "velobits theme rendered on the login page"

      - name: Clean up Keycloak container
        if: always()
        run: docker rm -f kc-ci 2>/dev/null || true
