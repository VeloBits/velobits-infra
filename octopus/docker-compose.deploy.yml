# Octopus deploy-time override — applied by octopus/deploy.sh on the VM:
#   docker compose -f docker-compose.yml -f octopus/docker-compose.deploy.yml up -d
#
# 1. keycloak-theme-builder: the CI pipeline ships a prebuilt
#    keycloak-theme/dist_keycloak/velobits.jar inside the deployment package,
#    so the VM never needs Node/Maven. `!reset` removes the base `build:` key
#    (requires docker compose >= 2.24 — deploy.sh's `config -q` catches older
#    versions) and the entrypoint becomes a presence check that satisfies
#    keycloak-dev's service_completed_successfully dependency.
# 2. keycloak-dev: KC_HOSTNAME comes from the Octopus-rendered .env so each
#    environment advertises its real public hostname instead of localhost,
#    and KC_DB_URL points at the REMOTE managed Postgres (Aiven) — deployed
#    environments run no database container.
# 3. keycloak-dev-db: parked behind the `local-db` profile. It only exists for
#    laptop quickstarts via the base compose file; on the VM the identity
#    data lives on Aiven.

services:
  # VM TLS: Cloudflare fronts all public hostnames (orange-cloud proxy) and
  # validates the origin with a Cloudflare Origin CA certificate that lives
  # OUTSIDE the purged package directory: /opt/velobits/certs/velobits-dev.crt
  # + .key (created once — see docs/octopus-deployment.md Part 6). This mount
  # replaces the base file's git-ignored mkcert dir (same container path, so
  # compose merge swaps the source); traefik/rules/tls.yml already points at
  # these filenames. Local dev machines keep using mkcert, unaffected.
  traefik:
    volumes:
      - /opt/velobits/certs:/etc/traefik/certs:ro

  keycloak-theme-builder:
    build: !reset null
    image: alpine:3
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f dist_keycloak/velobits.jar ]; then
          echo "[deploy] using prebuilt dist_keycloak/velobits.jar from the deployment package"
          exit 0
        fi
        echo "[deploy] ERROR: dist_keycloak/velobits.jar missing from the deployment package" >&2
        exit 1

  keycloak-dev-db:
    profiles: ["local-db"]

  keycloak-dev:
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME:?set KC_HOSTNAME in .env (rendered by Octopus from octopus/env.dev.template)}
      # JDBC form of the Aiven service URI with the DEV database, e.g.
      #   jdbc:postgresql://pg-xxxxx-yyy.aivencloud.com:12345/keycloak_dev?sslmode=require
      KC_DB_URL: ${KEYCLOAK_DEV_DB_URL:?set KEYCLOAK_DEV_DB_URL in .env (rendered by Octopus from octopus/env.dev.template)}
    depends_on:
      # The local Postgres is profiled out above; without required:false
      # compose would refuse to start keycloak-dev over the missing service.
      # (condition restated from the base file — the schema requires it.)
      keycloak-dev-db:
        condition: service_healthy
        required: false
