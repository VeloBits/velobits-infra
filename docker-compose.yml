# velobits-infra - shared VeloBits platform infrastructure (dev stack).
#
# Owns the org-level pieces that sit in front of / beside the product apps:
#   traefik        edge reverse proxy for all *.velobits.dev subdomains (:80)
#   keycloak-dev   identity provider (Velobits realm) + its own Postgres
#
# This stack creates the shared `velobits-net` Docker network. Product stacks
# (e.g. fixmytext-backend) join it as an external network, so:
#   - Traefik reaches Kong at http://kong:8000 (alias published by the app stack)
#   - App services reach Keycloak at http://keycloak-dev:8080
#
# Start THIS stack first, then the product stack:
#   docker compose up -d          # here
#   docker compose --profile dev up --build   # in fixmytext-backend
#
# Optional /etc/hosts entries for subdomain routing via Traefik (see README):
#   127.0.0.1 auth-dev.velobits.dev
#   127.0.0.1 api-dev.velobits.dev
#   127.0.0.1 develop-fixmytext.velobits.dev

services:

  # ══════════════════════════════════════════════════════════════════════════
  # TRAEFIK - edge reverse proxy for all *.velobits.dev subdomains.
  # Owns external ports :80 (redirect) and :443 (TLS). Dev routes live in
  # traefik/rules/; static config in traefik/traefik.yml (mounted).
  # ══════════════════════════════════════════════════════════════════════════

  traefik:
    image: traefik:v3.2
    container_name: velobits-traefik
    restart: unless-stopped
    # Static config lives in traefik/traefik.yml (mounted below) — no CLI flags,
    # so that file is the single source of truth. rules/ is watched, but Docker
    # Desktop on Windows often drops bind-mount change events, so after editing
    # ANY traefik file run: docker restart velobits-traefik
    ports:
      - "80:80"    # redirects to :443 (.dev is HSTS-preloaded)
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/rules:/etc/traefik/rules:ro
      # mkcert dev cert (git-ignored) — generate per machine, see traefik/rules/tls.yml.
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - velobits-net
      - velobits-proxy-net

  # ══════════════════════════════════════════════════════════════════════════
  # KEYCLOAK DEV  -  identity provider for the Velobits realm.
  # Dev realm export is at keycloak/realm-export-dev.json.
  # The prod equivalent is provisioned during production deploy
  # (docs/keycloak-production-setup.md).
  # ══════════════════════════════════════════════════════════════════════════

  keycloak-dev-db:
    image: postgres:16-alpine
    container_name: keycloak-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DEV_DB_USER:?set KEYCLOAK_DEV_DB_USER in .env}
      POSTGRES_PASSWORD: ${KEYCLOAK_DEV_DB_PASSWORD:?set KEYCLOAK_DEV_DB_PASSWORD in .env}
      POSTGRES_DB: keycloak_dev_db
    volumes:
      - keycloak-dev-pgdata:/var/lib/postgresql/data
    networks:
      - velobits-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DEV_DB_USER} -d keycloak_dev_db"]
      interval: 5s
      timeout: 3s
      retries: 5

# One-shot theme build: compiles keycloak-theme/ into dist_keycloak/velobits.jar
  # before keycloak-dev starts, so a fresh clone works with plain `docker compose up`
  # (no host Node/JDK needed). If the jar already exists the service exits
  # immediately — rebuilds must be explicit because Docker file-locks the mounted
  # jar while keycloak-dev runs (Windows EPERM on rename):
  #   docker compose stop keycloak-dev
  #   FORCE_THEME_REBUILD=1 docker compose up keycloak-theme-builder
  #   docker compose start keycloak-dev
  keycloak-theme-builder:
    build:
      context: ./keycloak-theme
      dockerfile: builder.Dockerfile
    container_name: keycloak-theme-builder
    restart: "no"
    mem_limit: 2g
    working_dir: /work
    environment:
      FORCE_THEME_REBUILD: ${FORCE_THEME_REBUILD:-0}
      # keycloakify fs.rename()s the finished jar from its cache dir into
      # dist_keycloak/. With the cache at its default location
      # (node_modules/.cache — a named volume here) that rename crosses
      # filesystems and dies with EXDEV. Keep the cache on the same bind
      # mount as dist_keycloak/. (.cache/ is git- and docker-ignored.)
      XDG_CACHE_HOME: /work/.cache
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -f dist_keycloak/velobits.jar ] && [ "$${FORCE_THEME_REBUILD}" != "1" ]; then
          echo "[theme-builder] dist_keycloak/velobits.jar exists — skipping (set FORCE_THEME_REBUILD=1 to rebuild)"
          exit 0
        fi
        echo "[theme-builder] building velobits.jar (first run downloads deps — takes a few minutes)..."
        npm ci
        npm run build-keycloak-theme
        echo "[theme-builder] done: dist_keycloak/velobits.jar"
    volumes:
      - ./keycloak-theme:/work
      # node_modules + ~/.m2 live in named volumes: keeps npm I/O inside the
      # Docker VM (bind-mounted node_modules on Windows is painfully slow) and
      # caches Maven deps across rebuilds.
      - theme-node-modules:/work/node_modules
      - theme-m2:/root/.m2
      - theme-npm-cache:/root/.npm
    networks:
      - velobits-net

  keycloak-dev:
    image: quay.io/keycloak/keycloak:26.0.8
    container_name: keycloak-dev
    restart: unless-stopped
    mem_limit: 1g
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-dev-db:5432/keycloak_dev_db
      KC_DB_USERNAME: ${KEYCLOAK_DEV_DB_USER:?set KEYCLOAK_DEV_DB_USER in .env}
      KC_DB_PASSWORD: ${KEYCLOAK_DEV_DB_PASSWORD:?set KEYCLOAK_DEV_DB_PASSWORD in .env}
      # KC_HOSTNAME deliberately unset: with KC_HOSTNAME_STRICT=false Keycloak
      # derives the hostname from each request (X-Forwarded-* via Traefik), so
      # https://auth-dev.velobits.dev, https://auth-dev.saurabh-yadav.me AND
      # direct http://localhost:8080 all get self-consistent URLs/issuers.
      # NOTE: the OIDC issuer therefore varies by host — point browser and
      # backend at the SAME base URL or token validation will fail on issuer.
      # Prod pins KC_HOSTNAME instead (docker-compose-prod.yml / octopus).
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_DEV_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:?set KEYCLOAK_DEV_ADMIN_PASSWORD in .env}
    volumes:
      - ./keycloak/realm-export-dev.json:/opt/keycloak/data/import/realm.json:ro
      # Keycloakify "velobits" theme jar - providers/, NOT themes/ (jar-based
      # themes are Keycloak providers). Build it BEFORE `docker compose up`,
      # otherwise the login page 500s (realm import itself still succeeds):
      #   cd keycloak-theme && npm ci && npm run build-keycloak-theme
      # start-dev picks up providers at startup; rebuild + restart to refresh.
      # Runtime knobs (SHADCN_THEME_APP_NAME, _LAYOUT, _PRESET, ...) can be set
      # under environment: to re-brand without rebuilding the jar.
      - ./keycloak-theme/dist_keycloak:/opt/keycloak/providers:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak-dev-db:
        condition: service_healthy
      keycloak-theme-builder:
        condition: service_completed_successfully
    networks:
      - velobits-net
      - velobits-proxy-net
    # KC_HEALTH_ENABLED=true exposes /health/ready on management port 9000.
    # The KC 26 UBI-micro image omits curl, so we use bash /dev/tcp to hit
    # the management health endpoint instead.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ══════════════════════════════════════════════════════════════════════════
  # KEYCLOAK BOOTSTRAP  -  one-shot init that provisions identity providers
  # (Google / GitHub) and SMTP on the Velobits realm via the Admin API.
  # The realm itself is imported by keycloak-dev (--import-realm); this service
  # only adds the env-driven config that can't live in the realm JSON. It is
  # idempotent: bootstrap.sh exits 0 if the realm already exists, and skips each
  # IdP whose OAuth credentials are blank.
  #
  # NOTE: bootstrap.sh requires bash + curl + python3, none of which ship in the
  # keycloak:26.0 runtime image. We use alpine and `apk add` them (~7s) rather
  # than maintaining a custom Dockerfile. The script's own 60-attempt wait loop
  # is kept as a backstop even though depends_on waits for service_healthy.
  # ══════════════════════════════════════════════════════════════════════════

  keycloak-bootstrap:
    image: alpine:3
    container_name: keycloak-bootstrap
    restart: "no"
    mem_limit: 128m
    cpus: "0.25"
    entrypoint:
      - /bin/sh
      - -c
      - apk add --no-cache bash curl python3 >/dev/null && exec bash /scripts/bootstrap.sh
    environment:
      # Internal service address - bootstrap.sh waits on $KEYCLOAK_URL/health/ready.
      KEYCLOAK_URL: http://keycloak-dev:8080
      KEYCLOAK_REALM: Velobits
      KEYCLOAK_ADMIN: ${KEYCLOAK_DEV_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_DEV_ADMIN_PASSWORD:?set KEYCLOAK_DEV_ADMIN_PASSWORD in .env}
      REALM_EXPORT_PATH: /scripts/realm-export-dev.json
      # Social login (optional - blank values leave the buttons disabled).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GH_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-}
      GH_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-}
      # SMTP (optional - gated on SMTP_HOST + SMTP_USERNAME inside the script).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Dedicated service account for account-svc Admin API calls (optional).
      # Bootstrap creates/updates the client; account-svc (fixmytext-backend
      # repo) reads the SAME values - keep the two .env files in sync.
      KEYCLOAK_SERVICE_ACCOUNT_ID: ${KEYCLOAK_SERVICE_ACCOUNT_ID:-account-svc}
      KEYCLOAK_SERVICE_ACCOUNT_SECRET: ${KEYCLOAK_SERVICE_ACCOUNT_SECRET:-}
      # Backchannel logout is NOT configured here: bootstrap.sh syncs it from
      # realm-export-dev.json (one backchannel.logout.url per app client).
      # `kong` resolves over velobits-net once the fixmytext-backend stack is up.
    volumes:
      - ./keycloak/bootstrap.sh:/scripts/bootstrap.sh:ro
      - ./keycloak/realm-export-dev.json:/scripts/realm-export-dev.json:ro
    depends_on:
      keycloak-dev:
        condition: service_healthy
    networks:
      - velobits-net
      - velobits-proxy-net


# ── Shared network ────────────────────────────────────────────────────────────
# Fixed name (not project-prefixed) + attachable so product stacks can join it
# with `external: true`. This stack owns and creates the network.
networks:
  velobits-net:
    name: velobits-net
    driver: bridge
  velobits-proxy-net:
    name: velobits-proxy-net
    external: true

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  # Keycloak's identity database (separate from product DBs by design -
  # identity and product data are never co-located).
  keycloak-dev-pgdata:
  # Theme-builder caches (npm deps + Maven repo) — safe to `docker volume rm`.
  theme-node-modules:
  theme-m2:
  theme-npm-cache:
